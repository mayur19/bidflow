            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/User'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: HttpOnly, SameSite=Lax opaque session cookie set by POST /auth/login (ADR-0005).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description:
        HMAC of the session token, returned by login and GET /auth/session. Required on POST/PUT/PATCH/DELETE
        when authenticated; Origin must also match APP_ORIGIN.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: q
      in: query
      description: Case-insensitive literal search (wildcards are escaped).
      schema:
        type: string
        maxLength: 120
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description:
        Planned (BF-047). A replayed key returns the original response; reuse with a different
        body returns 409.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: UNAUTHENTICATED
              message: Authentication required
    Forbidden:
      description: You do not have permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action
    NotFound:
      description: Resource not found (also returned for records of other organizations)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: NOT_FOUND
              message: Resource not found (also returned for records of other organizations)
    Conflict:
      description: 'Conflict: duplicate, stale version or invalid state transition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: CONFLICT
              message: 'Conflict: duplicate, stale version or invalid state transition'
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: VALIDATION_FAILED
              message: Request validation failed
              details:
                - path: budgetMinor
                  message: Budget must be a whole number of minor units
    RateLimited:
      description: Too many requests, slow down
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: RATE_LIMITED
              message: Too many requests, slow down
    NotImplemented:
      description: Not implemented yet (tracked as BF-027)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: Not implemented yet (tracked as BF-027)
              details:
                ticket: BF-027
    ServiceUnavailable:
      description: Database unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: SERVICE_UNAVAILABLE
              message: Database unavailable
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE_TRANSITION
        - RATE_LIMITED
        - CSRF_FAILED
        - NOT_IMPLEMENTED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
    ApiError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          description:
            Field issues, `{ ticket }` for 501, or `{ domainCode, issues }` for domain rule
            failures.
        requestId:
          type: string
      required:
        - code
        - message
    ErrorEnvelope:
      type: object
      properties:
        success:
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ApiError'
      required:
        - success
        - data
        - error
    PageMeta:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
      required:
        - total
        - page
        - limit
    Money:
      type: object
      properties:
        amountMinor:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Integer minor units (cents for USD). Never a float.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          examples:
            - USD
      required:
        - amountMinor
        - currency
    Role:
      type: string
      enum:
        - BUYER_ADMIN
        - REQUESTER
        - PROCUREMENT_OFFICER
        - APPROVER
        - RECEIVING_CLERK
        - SUPPLIER_USER
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - email
        - password
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
        - id
        - organizationId
        - organizationName
        - email
        - displayName
        - role
    SessionResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrfToken:
          type: string
          minLength: 32
      required:
        - user
        - csrfToken
    BudgetPeriod:
      type: string
      enum:
        - MONTHLY
        - QUARTERLY
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        budgetPeriod:
          $ref: '#/components/schemas/BudgetPeriod'
        budget:
          $ref: '#/components/schemas/Money'
        isActive:
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - name
        - budgetPeriod
        - budget
        - isActive
        - version
        - createdAt
        - updatedAt
    CreateDepartmentInput:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{1,15}$
          description: Trimmed and upper-cased server-side; stored form matches ^[A-Z0-9][A-Z0-9-]{1,15}$.
        name:
          type: string
          minLength: 1
          maxLength: 120
        budgetPeriod:
          $ref: '#/components/schemas/BudgetPeriod'
        budgetMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description:
            Budget in integer minor units of the organization currency. Currency is never accepted
            from the client.
      required:
        - code
        - name
        - budgetPeriod
        - budgetMinor
      additionalProperties: false
      examples:
        - code: FNB
          name: Food & Beverage
          budgetPeriod: MONTHLY
          budgetMinor: 1575050
    UpdateDepartmentInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        isActive:
          type: boolean
        version:
          type: integer
      required:
        - version
      additionalProperties: false
    CostCenter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        isActive:
          type: boolean
    CreateCostCenterInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name
    BudgetPeriodSummary:
      type: object
