# BidFlow API contract. x-status/x-ticket track implementation against docs/planning/backlog.md.
openapi: 3.1.0
info:
  title: BidFlow API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: 'Procurement and supplier bidding API for BidFlow.


    Conventions (see docs/api/README.md and ADR-0006):

    - Base path `/api/v1`; health checks at `/api/health/*`.

    - Every response uses the envelope `{ success, data, error, meta? }`.

    - Money is integer minor units plus an ISO currency; rates are basis points; quantities are thousandths
    of a unit (ADR-0013).

    - Session cookie authentication; unsafe methods require `X-CSRF-Token` and a matching Origin (ADR-0005).

    - Every query is scoped to the session organization; foreign ids return 404 (ADR-0003).

    - `x-status` marks each operation `implemented` or `pending`; pending operations enforce auth and
    permissions, then return 501 with `details.ticket` equal to `x-ticket`.'
servers:
  - url: http://localhost:5172/api/v1
    description: Local web dev server (proxies to the API)
  - url: http://localhost:4102/api/v1
    description: Local API direct
tags:
  - name: Auth
    description: Auth endpoints
  - name: Health
    description: Health endpoints
  - name: Departments
    description: Departments endpoints
  - name: Organization
    description: Organization endpoints
  - name: Users
    description: Users endpoints
  - name: Purchase requests
    description: Purchase requests endpoints
  - name: Approvals
    description: Approvals endpoints
  - name: Suppliers
    description: Suppliers endpoints
  - name: RFQs
    description: RFQs endpoints
  - name: Evaluation
    description: Evaluation endpoints
  - name: Awards
    description: Awards endpoints
  - name: Supplier portal
    description: Supplier portal endpoints
  - name: Purchase orders
    description: Purchase orders endpoints
  - name: Reports
    description: Reports endpoints
  - name: Notifications
    description: Notifications endpoints
  - name: Audit
    description: Audit endpoints
  - name: Account
    description: Account endpoints
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Sign in with email and password
      x-status: implemented
      x-ticket: BF-002
      security: []
      description:
        Sets the HttpOnly session cookie and returns the CSRF token for subsequent unsafe requests.
        Wrong password, unknown email and inactive account return the same 401. Origin must match APP_ORIGIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Sign out and delete the server session
      x-status: implemented
      x-ticket: BF-002
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required:
                      - loggedOut
                    properties:
                      loggedOut:
                        const: true
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/session:
    get:
      operationId: getSession
      tags:
        - Auth
      summary: Current session user and CSRF token
      x-status: implemented
      x-ticket: BF-002
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
