          type: array
          items:
            type: string
            enum:
              - WITHDRAWN
              - DISQUALIFIED
              - TECHNICALLY_NON_COMPLIANT
              - CURRENCY_MISMATCH
              - INCOMPLETE
              - NON_POSITIVE_TOTAL
