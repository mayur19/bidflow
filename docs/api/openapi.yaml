          type: integer
      required:
        - reason
    PurchaseRequestLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
          minLength: 1
        category:
          type: string
        unit:
          type: string
        quantityMilli:
          type: integer
          minimum: 1
          description: Quantity in thousandths of a unit (20 units = 20000).
        estimatedUnitMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    PurchaseRequest:
      type: object
      properties:
