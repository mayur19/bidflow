        supplierPreferenceId:
          type:
            - string
            - 'null'
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseRequestLine'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
    CreatePurchaseRequestInput:
      type: object
      properties:
        departmentId:
          type: string
          format: uuid
        purpose:
          type: string
          minLength: 1
        neededBy:
          type: string
          format: date
        supplierPreferenceId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          items:
