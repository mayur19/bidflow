        approved:
          $ref: '#/components/schemas/Money'
        committed:
          $ref: '#/components/schemas/Money'
        remaining:
          $ref: '#/components/schemas/Money'
    SetBudgetInput:
      type: object
      properties:
        amountMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        version:
          type: integer
      required:
        - amountMinor
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        defaultCurrency:
          type: string
          pattern: ^[A-Z]{3}$
          examples:
            - USD
        timezone:
          type: string
          examples:
            - America/New_York
        approvalThreshold:
          $ref: '#/components/schemas/Money'
    UpdateOrganizationInput:
      type: object
      properties:
        name:
          type: string
        timezone:
          type: string
        approvalThresholdMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        version:
          type: integer
      required:
        - version
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        isActive:
