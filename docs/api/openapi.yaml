          type:
            - integer
            - 'null'
        rank:
          type:
            - integer
            - 'null'
          minimum: 1
        isLowestPriced:
          type: boolean
        isLowestQualified:
          type: boolean
      required:
        - bidId
        - supplierId
        - supplierName
        - status
        - submittedAt
        - lines
        - totalMinor
        - maxLeadDays
        - qualified
        - ineligibilityReasons
        - criteria
        - missingCriterionIds
        - totalScorePpm
        - rank
        - isLowestPriced
        - isLowestQualified
