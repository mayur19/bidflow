                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required:
                      - status
                      - version
                    properties:
                      status:
                        type: string
                      version:
                        type: string
                  error:
                    type: 'null'
      servers:
        - url: http://localhost:4102/api
          description: Health endpoints are mounted outside /api/v1
  /health/ready:
